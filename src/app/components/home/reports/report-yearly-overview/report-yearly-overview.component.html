@if(!loading) {
<div class="chart-box-container">
    <div class="chart-container">
        <div class="chart-header">
            <h1 class="dashboard-sub-heading">Overview Of Payments & Requests</h1>
            <!-- <mat-button-toggle-group (change)="changeButton($event.value)" [hideSingleSelectionIndicator]="true">
                    <mat-button-toggle value="m">Monthly</mat-button-toggle>
                    <mat-button-toggle value="y">Yearly</mat-button-toggle>
                </mat-button-toggle-group> -->
        </div>

        <div style="display: block;">
            <canvas baseChart [datasets]="lineChartData" [labels]="lineChartLabels" [options]="lineChartOptions"
                [legend]="lineChartLegend" [type]="'line'" [plugins]="lineChartPlugins">
            </canvas>
        </div>
    </div>
    <div class="recent-bookings">
        <h1 class="dashboard-sub-heading">Families In Society</h1>
        <mat-accordion class="example-headers-align">
            @for (item of families; track item; let i = $index) {
            <mat-expansion-panel class="expansion-pannel" [ngClass]="{'border-red': i%2 ==0 , 'border-green': i%2 !=0}"
                hideToggle>
                <mat-expansion-panel-header class="expansion-header">
                    <mat-panel-title class="sub-heading">{{item.flatNumber}} - {{item.familyName}}</mat-panel-title>
                </mat-expansion-panel-header>
            </mat-expansion-panel>
            }
        </mat-accordion>
    </div>
</div>
} @else {
<div class="spinner">
    <mat-spinner [strokeWidth]="5"></mat-spinner>
    <span class="loading-txt">{{loaderText}}</span>
</div>
}
